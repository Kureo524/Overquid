name: Feature request
description: Propose a change to the core, the SDK or the tooling.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The problem to solve, and who it is for.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] …
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core, desktop, sdk, ui, plugins, docs, ci]
    validations:
      required: true
