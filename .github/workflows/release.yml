name: Release

# release-please keeps a release PR open on main (changelog and versions).
# Merging it tags the release; the jobs below then attach the Linux packages
# to the app's GitHub release and publish the npm packages.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release PR and tags
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      app: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sdk: ${{ steps.release.outputs['packages/sdk--release_created'] }}
      create: ${{ steps.release.outputs['packages/create-overlay-plugin--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A personal token: pull requests opened with the default
          # GITHUB_TOKEN do not trigger CI, and main requires its checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  packages:
    name: Linux packages
    needs: release-please
    if: needs.release-please.outputs.app == 'true'
    # The oldest supported runner: packages built against older libraries
    # install on more distributions.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev librsvg2-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the frontend, the shipped plugins and the scriptlets, then the
      # .deb and .rpm (targets in tauri.conf.json).
      - run: pnpm desktop build
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            target/release/bundle/deb/*.deb \
            target/release/bundle/rpm/*.rpm \
            --clobber
          # The SDK and generator releases are created after the app's and
          # would be "Latest"; the README's download link points there.
          gh release edit "$TAG" --latest

  npm:
    name: npm packages
    needs: release-please
    if: needs.release-please.outputs.sdk == 'true' || needs.release-please.outputs.create == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: GitHub's OIDC token proves to npm that this
      # workflow of this repository publishes; no npm token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
      # pnpm pack applies publishConfig (the SDK's published exports); npm
      # publishes the archive, as only npm does trusted publishing.
      - name: Publish @overquid/sdk
        if: needs.release-please.outputs.sdk == 'true'
        run: |
          pnpm --filter @overquid/sdk build
          (cd packages/sdk && pnpm pack --pack-destination "$RUNNER_TEMP")
          npm publish "$RUNNER_TEMP"/overquid-sdk-*.tgz --access public --provenance
      - name: Publish create-overlay-plugin
        if: needs.release-please.outputs.create == 'true'
        run: |
          (cd packages/create-overlay-plugin && pnpm pack --pack-destination "$RUNNER_TEMP")
          npm publish "$RUNNER_TEMP"/create-overlay-plugin-*.tgz --access public --provenance
